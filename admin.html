<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المصنع | LAMCO 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 p-6">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-black text-amber-400">⚙️ لوحة إدارة مصنع لامكو الأول</h1>
                <p class="text-slate-400 text-xs mt-1">التحكم بالمنتجات والبنر (التعديلات تظهر فوراً في متجر العملاء)</p>
            </div>
            <a href="index.html" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 px-4 py-2 rounded-xl text-xs font-bold transition">
                🌐 عرض متجر العملاء
            </a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Form 1: Add Product -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                <h2 class="text-base font-black mb-2 text-amber-400">➕ إضافة منتج جديد مع صورة</h2>
                <form id="addProductForm" onsubmit="handleAddNewProduct(event)" class="space-y-3 mt-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">اسم المنتج:</label>
                        <input type="text" id="newProductName" required placeholder="مثال: قطاع حديدي مخصص..." class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">وصف المنتج:</label>
                        <textarea id="newProductDesc" required placeholder="وصف المواصفات..." rows="2" class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none focus:border-amber-500"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-bold text-slate-300 mb-1">التصنيف:</label>
                            <input type="text" id="newProductSeries" required placeholder="Custom" class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none focus:border-amber-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-300 mb-1">صورة المنتج:</label>
                            <input type="file" id="newProductImage" accept="image/*" required class="w-full bg-slate-950 border border-slate-700 text-slate-400 text-xs rounded-xl file:bg-amber-500 file:text-slate-950 file:border-0 file:rounded-lg file:px-2 file:py-1 file:font-bold file:text-xs">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2.5 rounded-xl text-xs transition">إضافة المنتج للكتالوج 🚀</button>
                </form>
            </div>

            <!-- Form 2: Customize Banner & Machine Image -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                <h2 class="text-base font-black mb-2 text-amber-400">🖼️ تخصيص البنر وصورة المكينة</h2>
                <form id="updateBannerForm" onsubmit="handleUpdateBanner(event)" class="space-y-3 mt-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">عنوان البنر:</label>
                        <input type="text" id="bannerTitleInput" placeholder="مصنع لامكو الأول للحديد..." class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">صورة المكينة والكويل:</label>
                        <input type="file" id="bannerImageInput" accept="image/*" class="w-full bg-slate-950 border border-slate-700 text-slate-400 text-xs rounded-xl file:bg-amber-500 file:text-slate-950 file:border-0 file:rounded-lg file:px-2 file:py-1 file:font-bold file:text-xs">
                    </div>
                    <button type="submit" class="w-full bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 font-bold py-2.5 rounded-xl text-xs transition">تحديث البنر والمكينة ✨</button>
                    <button type="button" onclick="resetBanner()" class="w-full text-rose-400 hover:underline text-xs text-center pt-1">استعادة البنر الافتراضي</button>
                </form>
            </div>
        </div>

        <!-- Current Custom Products List for Management & Deletion -->
        <div class="mt-8 bg-slate-900 border border-slate-800 rounded-2xl p-6">
            <h2 class="text-base font-black mb-4 text-amber-400">📦 المنتجات المضافة حالياً (إدارة وحذف)</h2>
            <div id="adminProductsList" class="space-y-3">
                <!-- تعبئة تلقائية -->
            </div>
        </div>
    </div>

    <script>
        let customProducts = JSON.parse(localStorage.getItem('lamco_custom_products')) || [];

        function renderAdminProducts() {
            const list = document.getElementById('adminProductsList');
            list.innerHTML = '';
            if (customProducts.length === 0) {
                list.innerHTML = '<p class="text-slate-500 text-xs">لا توجد منتجات مضافة حتى الآن.</p>';
                return;
            }
            customProducts.forEach((p) => {
                list.innerHTML += `
                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <img src="${p.imageSrc}" class="w-10 h-10 object-cover rounded-lg border border-slate-700">
                            <div>
                                <h4 class="font-bold text-xs text-slate-200">${p.name}</h4>
                                <span class="text-[10px] text-amber-400">${p.series}</span>
                            </div>
                        </div>
                        <button onclick="deleteCustomProduct('${p.id}')" class="bg-rose-950/50 hover:bg-rose-600 text-rose-400 hover:text-white border border-rose-800 px-3 py-1.5 rounded-lg text-xs font-bold transition">حذف 🗑️</button>
                    </div>
                `;
            });
        }

        function handleAddNewProduct(event) {
            event.preventDefault();
            const name = document.getElementById('newProductName').value;
            const desc = document.getElementById('newProductDesc').value;
            const series = document.getElementById('newProductSeries').value;
            const fileInput = document.getElementById('newProductImage');

            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const newProd = {
                        id: 'custom-' + Date.now(),
                        name: name,
                        desc: desc,
                        series: series,
                        isDefaultImage: false,
                        imageSrc: e.target.result
                    };
                    customProducts.push(newProd);
                    localStorage.setItem('lamco_custom_products', JSON.stringify(customProducts));
                    renderAdminProducts();
                    document.getElementById('addProductForm').reset();
                    alert('تمت إضافة المنتج بنجاح وتحديث المتجر!');
                };
                reader.readAsDataURL(file);
            }
        }

        function deleteCustomProduct(id) {
            if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                customProducts = customProducts.filter(p => p.id !== id);
                localStorage.setItem('lamco_custom_products', JSON.stringify(customProducts));
                renderAdminProducts();
            }
        }

        function handleUpdateBanner(event) {
            event.preventDefault();
            const title = document.getElementById('bannerTitleInput').value;
            const fileInput = document.getElementById('bannerImageInput');
            const file = fileInput.files[0];

            if (title) localStorage.setItem('lamco_banner_title', title);
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    localStorage.setItem('lamco_banner_img', e.target.result);
                    alert('تم تحديث البنر وصورة المكينة بنجاح!');
                };
                reader.readAsDataURL(file);
            } else {
                alert('تم تحديث عنوان البنر بنجاح!');
            }
        }

        function resetBanner() {
            localStorage.removeItem('lamco_banner_title');
            localStorage.removeItem('lamco_banner_img');
            alert('تمت استعادة الإعدادات الافتراضية للبنر.');
        }

        window.onload = renderAdminProducts;
    </script>
</body>
</html>
